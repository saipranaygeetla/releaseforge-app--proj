services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: releaseforge
      POSTGRES_USER: releaseforge
      POSTGRES_PASSWORD: releaseforge-dev-password
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releaseforge -d releaseforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: releaseforge
      DATABASE_USER: releaseforge
      DATABASE_PASSWORD: releaseforge-dev-password
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: