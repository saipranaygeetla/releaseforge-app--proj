name: ReleaseForge CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: releaseforge_test
          POSTGRES_USER: releaseforge
          POSTGRES_PASSWORD: releaseforge-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U releaseforge -d releaseforge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run database migrations
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: releaseforge_test
          DATABASE_USER: releaseforge
          DATABASE_PASSWORD: releaseforge-ci-password
        run: |
          alembic upgrade head

      - name: Run tests
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: releaseforge_test
          DATABASE_USER: releaseforge
          DATABASE_PASSWORD: releaseforge-ci-password
        run: |
          pytest
        
      - name: Build Docker image
        run: |
          docker build -t releaseforge-api:${{ github.sha }} .  